plugins {
    id 'java'
    id "io.freefair.lombok" version "6.5.1"
    id "org.javacc.javacc" version "3.0.0"
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
}

dependencies {
    implementation 'net.portswigger.burp.extensions:montoya-api:2023.10.4'
    implementation 'org.swinglabs:swingx:1.6.1'
    implementation 'com.github.CoreyD97:Burp-Montoya-Utilities:54678c64'
    implementation 'org.apache.commons:commons-text:1.10.0'

    testRuntimeOnly files("${System.properties['user.home']}/BurpSuiteCommunity/burpsuite_community.jar")
}

sourceSets {
    main {
        java {
            srcDir compileJavacc.outputDirectory
            srcDir compileJjtree.outputDirectory
        }
    }
}

compileJjtree {
    include '**/*.java'
}

jar {
    baseName = project.name
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        // Burp provides the Montoya API when it loads the extension, so its jar is not packaged.
        (configurations.runtimeClasspath).findAll { !it.name.startsWith('montoya-api-') }.collect {
            if (it.isDirectory()) return it
            // The utilities library's jar also holds Lombok, which only the compiler needs, and
            // copies of Gson and of the Montoya API: only the library's own classes are packaged.
            it.name.startsWith('Burp-Montoya-Utilities-') ? zipTree(it).matching { include 'com/coreyd97/**' } : zipTree(it)
        }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
}

tasks.withType(Jar) {
    destinationDir = file("$rootDir/releases")
}
